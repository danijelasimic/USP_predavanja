<span class="oznaka p">Za zagrevanje</span>

```cpp
std::vector<int> v = {5, 1, 4};
std::set<int> s(v.begin(), v.end());
s.insert(4);
for (int x : s)

```

<ul class="opcije">
<li><b>A</b><code>5 1 4 4</code></li>

<span class="tacno">C</span> — `1 4 5`

`std::set` čuva elemente **uređene** i **bez ponavljanja**.

<div class="okvir">Kako to postiže — i koliko ga to košta — upravo je tema ovog kursa.</div>

## Šta je novo

Do sada ste bili **korisnik**: `#include <vector>` — i radi.

Sada ste **autor**:

- kako je struktura napravljena iznutra
- koliko koštaju njene operacije — i **zašto**
- kako da napravite strukturu koje u STL-u nema

---

## Zašto, kad STL već postoji?

- Da izaberete pravu: `vector` ili `deque`? `map` ili `unordered_map`?
- Da razumete kada je program spor — i zbog čega.
- Da napravite svoju strukturu kada gotova ne odgovara problemu.
- Da procenite kod koji je napisao neko drugi — ili **nešto** drugo.

---

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Niz `v` ima milion elemenata. Koja operacija **nije** brza, tj. nije $O(1)$?

<ul class="opcije">
<li><b>A</b><code>v[500000]</code></li>
<li><b>B</b><code>v.back()</code></li>
<li><b>C</b><code>v.insert(v.begin(), x)</code></li>
<li><b>D</b><code>v.size()</code></li>
</ul>

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">C</span> — da bi `x` stao na početak, svih milion elemenata se pomera za jedno mesto: $O(n)$.

<div class="okvir"><code>vector</code> <em>podržava</em> umetanje na početak. To ne znači da je ono jeftino.</div>

<p class="sitno">Zašto je baš tako napravljen: glava 3.</p>

---

## Jedna glava — jedna nedelja (1/2)

| glava | tema | u STL-u |
| --- | --- | --- |
| 1 | Uvod | — |
| 2 | Memorijski model | pokazivači, `new` / `delete` |
| 3 | Dinamički niz | `vector` |
| 4 | Povezane liste | `list`, `forward_list` |
| 5 | Stek | `stack` |
| 6 | Red i dek | `queue`, `deque` |
| 7 | Hip i red sa prioritetom | `priority_queue` |

| glava | tema | u STL-u |
| --- | --- | --- |
| 8 | Binarna stabla | — |
| 9 | Binarna stabla pretrage | osnova za `set`, `map` |
| 10 | Balansirana stabla | `set`, `map` |
| 11 | Heš tabele | `unordered_set`, `unordered_map` |
| 12 | Izbor strukture u praksi | sve zajedno |
| 13 | Napredne strukture | — |

<p class="sitno">Dodatak A: pregled C++-a — za čitanje, po potrebi.</p>

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Šta se nalazi „ispod haube" `std::map`?

<ul class="opcije">
<li><b>A</b>heš tabela</li>
<li><b>B</b>uređen niz</li>
<li><b>C</b>balansirano binarno stablo</li>
<li><b>D</b>povezana lista</li>
</ul>

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">C</span> — u g++ je to crveno-crno stablo (glava 10).

- A je `std::unordered_map` (glava 11).
- B: brza pretraga, ali sporo umetanje — videćemo već danas zašto.
- D: sve bi bilo $O(n)$.

- Položen deo (praktični ili usmeni) važi do kraja godine ili do ponovnog izlaska na taj deo.

## Testovi na predavanjima

- Kratka pitanja, iz onoga što smo radili na predavanjima.
- Ukupno do **10** dodatnih poena.

Danas, na kraju časa: **probni test**. 

Test je uvek *na kraju neke oblasti, nekad na kraju časa, nekad u sredini, a nekad na početku.*

**Bodovanje:**

- Studenti se sortiraju prema osvnojenom broju poena i prema vremenu kada su odgovor predali.
- U zavisnosti od rezultate, poeni se najčeće raspoređuju na sledeći način:
  - 1 poen dobija prvih 25% studenata
  - 0.75 poena dobija drugih 25% studenata
  - 0.5 poena dobija trećih 25% studenata
  - 0.25 poena dobija četvrtih 25% studenata
  - 0 poena dobijaju studenti koji nemaju tačnih odgovora

## `sadrzi` u uređenom nizu

```cpp
bool sadrzi(const std::vector<int>& a, int x)
{
    std::size_t l = 0, d = a.size();     // trazimo u [l, d)
    while (l < d) {
        std::size_t s = l + (d - l) / 2;
        if (a[s] == x)
            return true;
        if (a[s] < x)
            l = s + 1;
        else
            d = s;
    }
    return false;
}
```

<p class="sitno">Binarna pretraga iz algoritmike. U STL-u: <code>std::binary_search</code>.</p>

## `dodaj` u uređeni niz

```cpp [3|4-8|9]
void dodaj(std::vector<int>& a, int x)
{
    a.push_back(x);                     // jedno mesto vise
    std::size_t i = a.size() - 1;
    while (i > 0 && a[i - 1] > x) {
        a[i] = a[i - 1];
        --i;
    }
    a[i] = x;
}
```

<p class="sitno">U STL-u isto radi <code>a.insert(std::upper_bound(a.begin(), a.end(), x), x)</code>.</p>

## Blok 2 — ukratko

- Struktura podataka = organizacija + operacije; od organizacije zavisi cena.
- Ista kolekcija: neuređen ili uređen niz — isto značenje, različita cena.
- Uređenost: pretraga $O(\log n)$, ali umetanje i brisanje $O(n)$.
- Neuređen niz: dodavanje $O(1)$, brisanje zamenom poslednjim.
- Izbor zavisi od toga koje se operacije rade često.

<p class="sitno">U knjizi: glava 1, odeljak „Podaci, operacije i organizacija".</p>

## Invarijanta strukture

<div class="okvir">

**Invarijanta** (eng. *invariant*): uslovi pod kojima reprezentacija opisuje ispravno stanje strukture.

Mora da važi **od stvaranja objekta i između svake dve operacije**.

</div>

**Invarijanta uređenog niza**: svaki element, osim poslednjeg, manji je od sledećeg ili mu je jednak.

Važi i za prazan niz i za niz sa jednim elementom.

---

## Ugovor svake operacije

<svg viewBox="0 0 1100 200" class="kop" role="img" aria-label="Invarijanta važi između operacija">
<line x1="20" y1="80" x2="1080" y2="80" stroke="#3d4650" stroke-width="2"/>
<rect x="30" y="45" width="190" height="70" rx="8" class="obj"/><text style="font-size:28px" x="125" y="87" text-anchor="middle">stvaranje</text>
<rect x="320" y="45" width="190" height="70" rx="8" class="obj"/><text style="font-size:28px" x="415" y="87" text-anchor="middle">dodaj(8)</text>
<rect x="610" y="45" width="190" height="70" rx="8" class="obj"/><text style="font-size:28px" x="705" y="87" text-anchor="middle">sadrzi(9)</text>
<rect x="900" y="45" width="170" height="70" rx="8" class="obj"/><text style="font-size:28px" x="985" y="87" text-anchor="middle">obrisi(4)</text>
<circle cx="270" cy="80" r="20" fill="#a9dbb9"/><text style="font-size:28px" x="270" y="87" text-anchor="middle">✓</text>
<circle cx="560" cy="80" r="20" fill="#a9dbb9"/><text style="font-size:28px" x="560" y="87" text-anchor="middle">✓</text>
<circle cx="855" cy="80" r="20" fill="#a9dbb9"/><text style="font-size:28px" x="855" y="87" text-anchor="middle">✓</text>
<text style="font-size:28px" x="560" y="160" text-anchor="middle">✓ = invarijanta važi</text>
</svg>

- Operacija **sme da pretpostavi** da invarijanta važi kad počne.
- Operacija **mora da je uspostavi** pre nego što se završi.

---

## Tokom operacije sme da ne važi

Usred `dodaj(8)` nad `4 4 6 9 12 17`:

<div class="niz">
<span class="ime">usred</span>
<span class="c">4</span><span class="c">4</span><span class="c">6</span><span class="c">9</span><span class="c">12</span><span class="c n">12</span><span class="c">17</span>
</div>

Dve `12`, nema `8` — ovo nije ni stara ni nova kolekcija.

<div class="okvir">Korisnik ponovo dobija strukturu tek kad je invarijanta uspostavljena.</div>

---

## Poznato iz algoritmike: invarijanta petlje

| | petlje | strukture |
| --- | --- | --- |
| važi | pri svakoj proveri uslova | od stvaranja, između operacija |
| uspostavlja je | kod pre petlje | konstruktor |
| održava je | telo petlje | svaka operacija |
| sme da ne važi | usred tela | usred operacije |

Razlika: operacije nad strukturom se pozivaju **proizvoljnim redosledom**.

---

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Koji niz **ne** zadovoljava invarijantu uređenog niza?

<ul class="opcije">
<li><b>A</b>prazan niz</li>
<li><b>B</b><code>7</code></li>
<li><b>C</b><code>3 3 5</code></li>
<li><b>D</b><code>3 5 4</code></li>
</ul>

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">D</span> — `5` je veće od sledećeg elementa.

- A, B: nema para susednih elemenata, uslov važi „prazno".
- C: jednakost je dozvoljena — kolekcija sme da ima ponavljanja.

---

## Preduslov ili invarijanta?

```cpp
std::binary_search(v.begin(), v.end(), x);
```

Za `binary_search` uređenost je **preduslov**: brine o njoj onaj ko poziva.

U strukturi „uređen niz" ista osobina je **invarijanta**: brine o njoj sama struktura.

- Korisnik ne uređuje niz pred svaki `sadrzi(x)`.
- Zato `dodaj` i `obrisi` moraju da čuvaju poredak.

---

## Ko sme da dira reprezentaciju?

```cpp
std::vector<int> ur = {4, 4, 6, 9, 12, 17};
ur[0] = 100;               // niko nas ne sprecava
std::cout << sadrzi(ur, 100);
```

Poredak je pokvaren — `sadrzi` od tog trenutka može da laže.

<div class="okvir">Struktura može da garantuje invarijantu samo ako se sve izmene rade kroz njene operacije: <b>skrivena reprezentacija</b>.</div>

<p class="sitno">Kako se to radi u C++-u (<code>private</code>): vežbe, 3. nedelja, i glava 3.</p>

---

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

```cpp
std::set<int> s = {4, 6, 9};
*s.begin() = 100;
```

<ul class="opcije">
<li><b>A</b><code>s</code> je <code>100 6 9</code></li>
<li><b>B</b><code>s</code> je <code>6 9 100</code> — set se sam preuredi</li>
<li><b>C</b>greška pri prevođenju</li>
<li><b>D</b>prevodi se, ali program pada</li>
</ul>

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">C</span> — *assignment of read-only location*

Elementi skupa su konstantni: promena bi pokvarila poredak, pa je `set` ni ne dozvoljava.

Promena vrednosti u skupu = `erase` staru, `insert` novu — kroz operacije.

<div class="okvir">STL čuva svoju invarijantu tako što ni ne prevodi kod koji bi je narušio.</div>

---

## Pišemo zajedno: `obrisi` u neuređenom nizu

Imamo gotove `dodaj` i `sadrzi` za obe organizacije.

Pišemo `neuredjen::obrisi(a, x)` — brisanje zamenom poslednjim.

<p class="sitno"><code>neuredjen::</code> i <code>uredjen::</code> su prostori imena — kao <code>std::</code> — da bi obe verzije mogle da se zovu isto.</p>

---

## `obrisi` u neuređenom nizu

```cpp [3|4|5-6|7]
void obrisi(std::vector<int>& a, int x)
{
    for (std::size_t i = 0; i < a.size(); ++i)
        if (a[i] == x) {
            a[i] = a.back();
            a.pop_back();
            return;
        }
}
```

Ako `x` nema — petlja prođe do kraja i niz ostaje isti.

---

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Šta ako zaboravimo `a.pop_back();`?

```cpp
std::vector<int> a = {12, 4, 9, 4, 17, 6};
obrisi(a, 4);
// ispis elemenata a
```

<ul class="opcije">
<li><b>A</b><code>12 6 9 4 17</code></li>
<li><b>B</b><code>12 6 9 4 17 6</code></li>
<li><b>C</b><code>12 9 4 17 6</code></li>
<li><b>D</b><code>12 4 9 4 17 6</code></li>
</ul>

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">B</span> — `12 6 9 4 17 6`

`4` je nestala, ali veličina nije smanjena: sada u kolekciji ima **dve** šestice.

Prevodi se, ne pada, i deluje skoro ispravno — najgora vrsta greške.

---

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Zamka</span>

Ispravan `neuredjen::obrisi` pozovemo nad **uređenim** nizom:

```cpp
std::vector<int> u = {4, 4, 6, 9, 12, 17};
neuredjen::obrisi(u, 4);
std::cout << uredjen::sadrzi(u, 17);
```

<ul class="opcije">
<li><b>A</b><code>1</code></li>
<li><b>B</b><code>0</code></li>
<li><b>C</b>program pada</li>
<li><b>D</b>greška pri prevođenju</li>
</ul>

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">B</span> — `u` je sada `17 4 6 9 12`.

`17` jeste u nizu, ali binarna pretraga ide desno od sredine i ne nalazi ga.

<div class="okvir">Kad je invarijanta narušena, operacije počnu da lažu — a prevodilac ne zna ništa o invarijanti.</div>

---

## Podsetnik: $O$-notacija

<div class="f">
$f(n) = O(g(n))$ ako postoje konstante $c > 0$ i $n_0$ takve da je
$$f(n) \le c \cdot g(n) \quad \text{za svako } n \ge n_0.$$
</div>

- $n$ je broj elemenata u strukturi.
- To je **gornja** granica — navodimo najmanju koja važi.
- Ako nije rečeno drugačije: **najgori slučaj**.

---

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Koja su tvrđenja tačna?

1. $3n + 5 = O(n)$
2. $n = O(n^2)$
3. $n^2 = O(n)$

<ul class="opcije">
<li><b>A</b>samo 1</li>
<li><b>B</b>1 i 2</li>
<li><b>C</b>sva tri</li>
<li><b>D</b>samo 2</li>
</ul>

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">B</span>

- 1: $3n + 5 \le 4n$ za $n \ge 5$.
- 2: tačno — $O$ je samo gornja granica. Ali za pretragu neuređenog niza pišemo $O(n)$, ne $O(n^2)$.
- 3: nijedna konstanta $c$ ne pomaže kad $n > c$.

---

## Šta sve ocenjujemo

- **Najgori slučaj** — podrazumevano.
- **Prosečan slučaj** — kod heš tabela (glava 11).
- **Amortizovana cena** — kroz niz operacija (glava 3).
- **Memorija** — i ono što troši sama organizacija: pokazivači, prazan kapacitet.

<div class="okvir">Isti red složenosti ≠ ista brzina. Raspored u memoriji i keš imaju veliki uticaj (glava 4).</div>

---

<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Za razmišljanje</span>

Neuređen niz: brzo `dodaj`, sporo `sadrzi`.
Uređen niz: brzo `sadrzi`, sporo `dodaj`.

Da li postoji organizacija u kojoj su **obe** operacije brze — recimo $O(\log n)$?

---

<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

**Postoji** — ali ne kao niz.

- balansirano stablo pretrage: sve tri operacije $O(\log n)$ — `std::multiset` (glava 10)
- heš tabela: prosečno $O(1)$ — `std::unordered_multiset` (glava 11)

<div class="okvir">Do kraja semestra znaćete kako se prave — i šta plaćaju za tu brzinu.</div>

---

## Glava 1 — ukratko

1. Struktura podataka = organizacija + operacije; organizacija određuje cenu.
2. Biramo prema ceni operacija koje su **važne i česte**.
3. „Šta" (značenje operacija) i „kako" (reprezentacija) su odvojeni.
4. Invarijanta važi od stvaranja i između svake dve operacije; svaka operacija je čuva.
5. Skrivena reprezentacija: samo operacije smeju da menjaju strukturu.

<p class="sitno">U knjizi: glava 1 u celini.</p>
