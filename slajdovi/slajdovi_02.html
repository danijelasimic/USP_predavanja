## Memorija: niz bajtova

<div class="niz gore">
<span class="ime">memorija</span>
<span data-id="m0" class="c prazno" data-i="1000"></span><span data-id="m1" class="c prazno" data-i="1001"></span><span data-id="m2" class="c prazno" data-i="1002"></span><span data-id="m3" class="c prazno" data-i="1003"></span><span data-id="m4" class="c prazno" data-i="1004"></span><span data-id="m5" class="c prazno" data-i="1005"></span><span data-id="m6" class="c prazno" data-i="1006"></span><span data-id="m7" class="c prazno" data-i="1007"></span>

- **bajt** (eng. *byte*) — najmanji deo memorije kome se pristupa
- **adresa** (eng. *address*) — redni broj bajta
- Adresa kaže **gde**, ne **šta** — kao kućni broj.

## Memorija: niz bajtova

<div class="niz gore">
<span class="ime">memorija</span>
<span data-id="m0" class="c" data-i="1000" data-g="a"></span><span data-id="m1" class="c" data-i="1001"></span><span data-id="m2" class="c" data-i="1002"></span><span data-id="m3" class="c" data-i="1003"></span><span data-id="m4" class="c prazno" data-i="1004"></span><span data-id="m5" class="c prazno" data-i="1005"></span><span data-id="m6" class="c prazno" data-i="1006"></span><span data-id="m7" class="c prazno" data-i="1007"></span>

```cpp
int a = 10;
```

- `a` zauzima **četiri** uzastopna bajta; u njima je zapisano 10.
- Adresa promenljive = adresa njenog **prvog** bajta: 1000.

---

<!-- [8] Koliko bajtova? -->
## Koliko bajtova?

```cpp
sizeof(char)     // 1  - uvek
sizeof(int)      // 4  - obicno
sizeof(double)   // 8  - obicno
```

- Veličinu određuje **tip**. Jezik garantuje samo `sizeof(char) == 1`.
- Prava adresa izgleda ovako: `0x7ffc3a9e1b2c` — i svaki put je drugačija.
- Na slajdovima pišemo male brojeve: 1000, 1004, 2000…

---

<!-- [9] Vrednost i adresa -->
## Vrednost i adresa

```cpp
int a = 10;
a = 5;
```

- **Vrednost**: sadržaj bajtova. Menja se.
- **Adresa**: mesto tih bajtova. Ne menja se dok promenljiva postoji.

<div class="okvir">Adresa je i sama podatak: broj koji može da se zapamti i kasnije upotrebi.</div>

---

<!-- [10] Pokazivač -->
## Pokazivač

```cpp
int a = 10;
int* p = &a;

sizeof(int*)     // 8  - na 64-bitnom sistemu
```

<svg viewBox="0 0 900 150" class="kop" role="img" aria-label="Pokazivač p sadrži adresu promenljive a"><rect x="140" y="45" width="120" height="58" class="cel"/><text x="200" y="81" class="sr">1000</text><text x="200" y="35" class="sr ime">p</text><text x="200" y="123" class="sr adr">2000</text><rect x="600" y="45" width="120" height="58" class="cel"/><text x="660" y="81" class="sr">10</text><text x="660" y="35" class="sr ime">a</text><text x="660" y="123" class="sr adr">1000</text><path d="M262,74 C413.2,74 446.8,74 584.0,74.0" class="lin"/><polygon points="598,74 584.0,68.0 584.0,80.0" class="glava"/></svg>

- **Pokazivač** (eng. *pointer*): promenljiva čija je vrednost adresa.
- `int*` — pokazivač na `int`. I `p` je objekat: ima svoju adresu i veličinu.

---

<!-- [11] Zvezdica u deklaraciji -->
## Zvezdica u deklaraciji

```cpp
int* p3, p4, *p5;
```

- `p3` i `p5` su pokazivači. `p4` je običan `int`.
- Zvezdica se odnosi na promenljivu uz koju stoji, ne na ceo red.

<div class="okvir">Dogovor: svaki pokazivač u svom redu, zvezdica uz tip — <code>int* p;</code></div>

---

<!-- [12] Dva operatora -->
## Dva operatora

| izraz | čita se | daje |
| --- | --- | --- |
| `&a` | adresa od `a` | adresu objekta |
| `*p` | ono na šta `p` pokazuje | **sam objekat**, ne kopiju |

```cpp
int b = *p;    // cita se objekat na koji p pokazuje
*p = 5;        // menja se objekat na koji p pokazuje
```

<p class="sitno"><code>*p</code> se zove dereferenciranje (eng. <em>dereferencing</em>). Zvezdica u <code>int* p</code> je deo tipa, a u <code>*p</code> je operator.</p>

<span class="oznaka o">Odgovor</span>

<span class="tacno">C</span> — `1 9 1`

- `int* q = p;` kopira **adresu**: oba pokazuju na `a`. Novi `int` ne nastaje.
- `q = &c;` menja samo `q`. Pokazivač `p` i dalje pokazuje na `a`.

<div class="okvir">Kopiranje pokazivača ne kopira objekat. A dva pokazivača su i dalje dve zasebne promenljive.</div>

<!-- [19] & traži objekat -->
## `&` traži objekat

```cpp
int a = 1;
int* p;

p = &a;          // u redu
p = &3;          // greska
p = &(a + 3);    // greska
```

- `3` i `a + 3` su **vrednosti**, a ne objekti u memoriji — nemaju adresu.
- g++: *lvalue required as unary '&' operand*

<div class="okvir">Adresu ima samo ono što negde u memoriji postoji: promenljiva, element niza, član strukture.</div>

<!-- [22] Pokazivaču se ne dodeljuje broj -->
## Pokazivaču se ne dodeljuje broj

```cpp

a = 10;      // greska pri prevodjenju
```

- g++: *invalid conversion from 'int' to 'int\*'*
- Adresa jeste broj, ali tip `int*` nije celobrojni tip.
- Jedini „broj" koji pokazivač sme da dobije je `nullptr`.

<p class="sitno">U C-u se ovo prevodi, uz upozorenje.</p>

<!-- [26] Tip pokazivača nije ukras -->
## Tip pokazivača nije ukras

```cpp
float f = 5;
int* p = &f;      // greska pri prevodjenju
```

- g++: *cannot convert 'float\*' to 'int\*'*
- `int*` znači: na toj adresi je `int`, čitaj ga kao `int`.

Ako ipak nateramo prevodilac:

```cpp
int* p = reinterpret_cast<int*>(&f);
std::cout << *p;      // 1084227584
```

Bajtovi broja `5.0f`, pročitani kao da su `int`.

---

<!-- [27] Kad se ne poklapa ni veličina -->
## Kad se ne poklapa ni veličina

```cpp
char c = 5;
int* p = reinterpret_cast<int*>(&c);
std::cout << *p;
```

<div class="niz gore">
<span class="ime">memorija</span>
<span class="c s n" data-i="1000" data-g="c">5</span><span class="c s x" data-i="1001">?</span><span class="c s x" data-i="1002">?</span><span class="c s x" data-i="1003">?</span>
</div>

- `c` zauzima **1** bajt, a `*p` čita **4**.
- Tri bajta nisu naša: kod nas ispis `261`, pa `-473460987`…
- Sanitajzer: `stack-buffer-overflow`.

<!-- [28] Koliko je velik pokazivač? -->
## Koliko je velik pokazivač?

```cpp
sizeof(char*)      // 8
sizeof(int*)       // 8
sizeof(double*)    // 8
```

- Svaki pokazivač čuva **adresu** — a adresa je iste veličine bez obzira na šta pokazuje.
- Tip pokazivača ne određuje njegovu veličinu, nego **kako se čita** ono na šta pokazuje: koliko bajtova i kao šta.

<p class="sitno">8 bajtova na 64-bitnom sistemu.</p>

---

<!-- [29] Nulti pokazivač -->
## Nulti pokazivač

```cpp
int* p = nullptr;      // ne pokazuje ni na jedan objekat

if (p != nullptr) {
    *p = 5;
}
```

- `nullptr` znači „nema objekta": kraj liste, neuspešna pretraga.
- `int* p;` bez inicijalizacije **nije** `nullptr` — vrednost je neodređena.
- `*p` nad nultim pokazivačem: **nedefinisano ponašanje** (eng. *undefined behavior*).

<p class="sitno">Obično <code>Segmentation fault</code> — ali jezik to ne garantuje.</p>

<!-- [37] Pokazivač i referenca -->
## Pokazivač i referenca

| svojstvo | pokazivač | referenca |
| --- | --- | --- |
| inicijalizacija pri deklaraciji | nije obavezna | obavezna |
| veza sa objektom | može se preusmeriti | stalna |
| stanje „nema objekta" | `nullptr` | ne postoji |
| pristup objektu | `*p`, `p->clan` | `r`, `r.clan` |
| sopstvena adresa | ima je | nema je |

<!-- [38] Prenos argumenata: dva načina -->
## Prenos argumenata: dva načina

<div class="dve">
<div>

```cpp
void razmeni(int& a, int& b)
{
    int tmp = a;
    a = b;
    b = tmp;
}

razmeni(x, y);
```

</div>
<div>

```cpp
void razmeni(int* pa, int* pb)
{
    int tmp = *pa;
    *pa = *pb;
    *pb = tmp;
}

razmeni(&x, &y);
```

</div>
</div>

- Sa `&x` se na mestu poziva **vidi** da funkcija menja argument.
- Referenca uvek dobija postojeći objekat; pokazivač može biti i `nullptr`.

## Referenca samo za čitanje: `const T&`

```cpp
void ispisi(const std::string& s)
{
    std::cout << s << '\n';
}
```

| parametar | kada |
| --- | --- |
| `T` | mali tipovi (`int`, `double`), samo čitanje |
| `const T&` | veliki objekti, samo čitanje — nema kopiranja |
| `T&` | funkcija menja argument |

<p class="sitno">Zato je na početku časa trebalo <code>void dodaj(std::vector&lt;int&gt;&amp; v)</code>.</p>

## Referenca kao povratna vrednost

```cpp

{
    return podaci[indeks];
}
```

```cpp

element(niz, 1) = 99;      // menja se niz[1]
```

Poziv funkcije **jeste** taj element, pa sme da stoji levo od `=`.

<p class="sitno">Pogled unapred: zato kod vektora radi <code>v[i] = 99;</code> — <code>operator[]</code> vraća <code>T&amp;</code> (glava 3).</p>

<!-- [45] Viseća referenca -->
## Viseća referenca

```cpp
int& neispravno()
{
    int x = 10;
    return x;
}
```

- `x` prestaje da postoji kad se funkcija završi.
- Referenca ostaje bez objekta: **viseća referenca** (eng. *dangling reference*).
- g++ upozorava: *reference to local variable 'x' returned*.

<p class="sitno">Funkcija <code>element</code> nema taj problem: niz nije njena lokalna promenljiva.</p>

---

<!-- [46] Kada pokazivač, kada referenca? -->
## Kada pokazivač, kada referenca?

Referenca je bezbednija. Ali u strukturama podataka nije dovoljna:

| treba nam | primer | zato |
| --- | --- | --- |
| „nema objekta" | poslednji čvor nema sledeći | `nullptr` |
| veza koja se menja | umetanje u listu, novi blok niza | preusmeravanje |
| objekat koji nastaje u toku rada | novi čvor | `new` vraća adresu |

<div class="okvir">Spolja (parametri, povratne vrednosti): <b>reference</b>. Iznutra (veze, memorija): <b>pokazivači</b>.</div>

---

<!-- [34a] const i pokazivač -->
## `const` i pokazivač

<div class="dve">
<div>

```cpp
const int* p = &a;
int* const r = &a;

p = &b;     // u redu
*p = 5;     // greska
r = &b;     // greska
*r = 5;     // u redu
```

</div>
<div>

| deklaracija | zaključan je |
| --- | --- |
| `const int* p` | objekat |
| `int const* p` | objekat — isto |
| `int* const p` | pokazivač |
| `const int* const p` | oba |

</div>
</div>

<div class="dve">
<div>

```cpp
const int c = 3;
int* x = &c;         // greska
const int* y = &c;   // u redu
```

</div>
<div>

Na `const` objekat ne može običan `int*`: preko njega bi se objekat mogao promeniti.

</div>
</div>

<p class="sitno"><code>const</code> levo od <code>*</code> štiti objekat, desno od <code>*</code> štiti pokazivač. Obrnuto je dozvoljeno: <code>const int*</code> sme da pokazuje i na običan <code>int</code>.</p>

<!-- [47] Blok 1 — ukratko -->
## Blok 1 — ukratko

- Svaki objekat ima **vrednost** i **adresu**; pokazivač je promenljiva koja čuva adresu.
- `&a` daje adresu, `*p` daje objekat. `p->clan` za strukture.
- `*p = …` menja objekat; `p = …` menja pokazivač.
- Kopiranje pokazivača ne kopira objekat.
- Referenca: drugo ime, stalna veza, nema `nullptr`.
- `const T&` za čitanje bez kopije, `T&` za izmenu i za povratnu vrednost.

<p class="sitno">U knjizi: odeljci „Adrese i pokazivači" i „Reference".</p>

<!-- [54] Ime niza i pokazivač -->
## Ime niza i pokazivač

```cpp
int a[5] = {};
int* p = a;         // adresa prvog elementa
int* q = &a[0];     // isto
```

Ime niza se u izrazu pretvara u pokazivač na prvi element.

Ali niz **nije** pokazivačka promenljiva:

```cpp
a = p;    // greska
++a;      // greska
```

<!-- [56] Indeks je pokazivačka aritmetika -->
## Indeks je pokazivačka aritmetika

| zapis sa indeksom | zapis sa pokazivačem |
| --- | --- |
| `a[i]` | `*(a + i)` |
| `&a[i]` | `a + i` |
| `p[1]` | `*(p + 1)` |

- Indeks sme da stoji i uz pokazivač: `p[1]`, pa i `p[-1]`.
- `q - p` je razlika **indeksa**, ne broj bajtova.

## Kraj niza: `a + n`

```cpp
for (int* p = a; p != a + 5; ++p)
    std::cout << *p << ' ';

- `a + n` pokazuje **neposredno iza** poslednjeg elementa.

<div class="okvir">Poznato iz STL-a: <code>std::sort(v.begin(), v.end())</code> — i <code>v.end()</code> je mesto iza poslednjeg.</div>

<!-- [61] Zvezdica i ++: šta se menja? -->
## Zvezdica i `++`: šta se menja?

| izraz | značenje |
| --- | --- |
| `*p + 1` | pročitana vrednost, uvećana za 1 |
| `*(p + 1)` | sledeći element |
| `(*p)++` | uvećava se **element** |
| `++*p`   | uvećava se **element** |
| `*p++` | čita se element, a pomera se **pokazivač** |

<!-- [68] Granice niza niko ne proverava -->
## Granice niza niko ne proverava

```cpp
int a[5];
a[5] = 1;       // prevodi se
a[100] = 1;     // prevodi se
```

- Nedefinisano ponašanje. Program **ne mora** da padne.
- Može tiho da prepiše neku drugu promenljivu.

| | provera indeksa |
| --- | --- |
| `a[i]`, `v[i]` | nema |
| `v.at(i)` | ima — izuzetak `std::out_of_range` |

<!-- [69] Šta statički niz ne može -->
## Šta statički niz ne može

- Veličina mora biti poznata **pri prevođenju**.

```cpp
int n;
std::cin >> n;
int podaci[n];      // nije standardni C++
```

- Lokalni niz nestaje na kraju bloka.
- Ne može da poraste.

<div class="okvir">Treba nam memorija koju program traži <b>dok radi</b> — i vraća kad mu više ne treba.</div>

## `new` i `delete`: jedan objekat

```cpp
int* p = new int(10);

*p = 20;

delete p;
p = nullptr;
```

- `new` zauzima prostor i vraća **adresu** novog objekta.
- Objekat nema ime: pristupa mu se samo preko pokazivača.
- `new int` — vrednost neodređena. `new int()` — nula.

<!-- [75] Šta je zauzeto sa new, oslobađa se sa delete -->
## Šta je zauzeto sa `new`, oslobađa se sa `delete`

| zauzimanje | oslobađanje |
| --- | --- |
| `T* p = new T;` | `delete p;` |
| `T* p = new T[n];` | `delete[] p;` |

- Oblik mora da se poklopi — i kad niz ima jedan element.
- Oslobađa se pokazivač dobijen od `new`, ne `p + 1`.
- Automatski objekat se ne oslobađa. Isti objekat se ne oslobađa dvaput.
- `delete` nad `nullptr` je dozvoljen i ne radi ništa.

<!-- [79] Blok 2 — ukratko -->
## Blok 2 — ukratko

- Niz je kontinualan: $\operatorname{adresa}(a[i]) = A + i \cdot s$, pa je `a[i]` u $O(1)$.
- `a[i]` je `*(a + i)`; `p + k` pomera za `k` elemenata.
- Niz ne nosi svoju dužinu; funkciji se prenosi pokazivač i `n`.
- Granice niko ne proverava.
- `new` / `delete`, `new[]` / `delete[]` — uvek u paru.
- Zauzet niz ima stalnu veličinu.

<p class="sitno">U knjizi: odeljci „Statički niz i njegova ograničenja" i „Dinamička alokacija".</p>

<!-- [81] Životni vek objekta -->
## Životni vek objekta

Za ispravan pokazivač nije dovoljno znati adresu. Objekat mora još da **postoji**.

- **Životni vek** (eng. *lifetime*): period u kome objekat postoji.
- **Doseg** (eng. *scope*): deo koda u kome se ime može upotrebiti.

| | životni vek |
| --- | --- |
| lokalna promenljiva | od deklaracije do kraja bloka |
| dinamički objekat | od `new` do `delete` |

---

<!-- [82] Automatski životni vek -->
## Automatski životni vek

```cpp
void primer()
{
    int spoljasnji = 10;
    {
        int unutrasnji = 20;
        spoljasnji += unutrasnji;
    }   // ovde nestaje unutrasnji

}       // ovde nestaje spoljasnji
```

- Svaki poziv funkcije ima **svoje** lokalne promenljive — i rekurzivni.
- Dinamički objekat ne nestaje na kraju bloka: može da **nadživi** funkciju koja ga je napravila.

<!-- [85] Konstruktor i destruktor -->

## Konstruktor i destruktor

```cpp
struct Trag {
    int oznaka;

    Trag(int k) : oznaka(k) { std::cout << "Konstruktor " << oznaka << '\n'; }
    ~Trag()                 { std::cout << "Destruktor " << oznaka << '\n'; }
};
```

- **Konstruktor**: zove se kao struktura; izvršava se kad objekat **nastaje**.
- **Destruktor**: `~` ispred imena; izvršava se kad objekat **nestaje**.
- `: oznaka(k)` postavlja član pre tela konstruktora.

<p class="sitno">Poznato iz STL-a: lokalni <code>std::vector</code> na kraju bloka sam vrati memoriju. To radi njegov destruktor.</p>

<!-- [89] Vlasništvo -->
## Vlasništvo

Dinamički objekat ne nestaje sam. Neko mora da napiše `delete` — **tačno jednom**.

- **Vlasnik** (eng. *owner*): deo programa zadužen za `delete`.
- **Vlasnički pokazivač**: preko njega se objekat oslobađa.
- **Pozajmljeni pokazivač**: preko njega se objekat samo koristi.

Oba su tipa `int*`. Iz tipa se uloga **ne vidi** — mora da bude dogovorena.

<div class="okvir">Naš dogovor: struktura je vlasnik sve memorije koju zauzme. Svi ostali dobijaju pozajmljene pokazivače.</div>

## Tri greške, isti izvor

| greška | šta se desilo |
| --- | --- |
| curenje memorije | `delete` nije napisan |

<!-- [104] Odakle sve ove greške? -->
## Odakle sve ove greške?

```cpp
int* a = new int[n];

if (!ucitaj(a, n)) {
    delete[] a;
    return 1;
}

obradi(a, n);

delete[] a;
return 0;
```

- `delete` je zasebna naredba: na **svakom** izlazu iz funkcije, i **tačno jednom**.
- Šta se pri izlasku iz bloka dešava samo od sebe?

<p class="fragment"><b>Destruktori lokalnih objekata.</b></p>

---

<!-- [105] RAII -->
## RAII

<div class="okvir">

**Konstruktor zauzima, destruktor oslobađa.**

</div>

- Memoriju poverimo objektu koji ima destruktor.
- Kad objekat nestane — na bilo kom izlazu iz funkcije — destruktor oslobodi memoriju.
- Vlasnik je objekat, a ne programerovo pamćenje.

<p class="sitno">RAII = <em>Resource Acquisition Is Initialization</em>. Resurs je najčešće memorija, ali može biti i otvorena datoteka.</p>

---

<!-- [106] Pišemo zajedno: destruktor za Ocene -->
## Pišemo zajedno: destruktor za `Ocene`

```cpp
struct Ocene {
    int broj;
    int* podaci;

    Ocene(int n) : broj(n), podaci(new int[n]{}) {}

    // ovde pisemo destruktor
};
```

Konstruktor već zauzima niz. Niko ga ne oslobađa.

---

<!-- [107] Ocene sa destruktorom -->
## `Ocene` sa destruktorom

```cpp [7-11]
struct Ocene {
    int broj;
    int* podaci;

    Ocene(int n) : broj(n), podaci(new int[n]{}) {}

    ~Ocene()
    {
        std::cout << "oslobadjam\n";
        delete[] podaci;
    }
};
```

Niz sada nestaje zajedno sa objektom. Onaj ko koristi `Ocene` ne piše nijedan `delete`.

<!-- [110] Pravilo trojke -->
## Pravilo trojke

Klasa kojoj treba destruktor, po pravilu mora da definiše i:

- konstruktor kopije — `Ocene b = a;`
- operator dodele — `b = a;`

To je **pravilo trojke** (eng. *rule of three*). Za sada biramo jednostavnije — kopiranje zabranjujemo:

```cpp
Ocene(const Ocene&) = delete;
Ocene& operator=(const Ocene&) = delete;
```

Sada `Ocene b = a;` daje grešku **pri prevođenju**: *use of deleted function*.

<p class="sitno">Duboko kopiranje pišemo sledeće nedelje. Sa premeštanjem je to „pravilo petorke" — van okvira kursa.</p>

---

<!-- [111] Gotovo rešenje: std::unique_ptr -->
## Gotovo rešenje: `std::unique_ptr`

```cpp
void obradi(bool prekini)
{
    auto p = std::make_unique<int>(42);     // #include <memory>

    std::cout << *p << '\n';

    if (prekini)
        return;       // ovde se ceo broj oslobadja

    *p = 17;
}                     // i ovde
```

- **Pametni pokazivač** (eng. *smart pointer*): koristi se kao pokazivač, ponaša se kao vlasnik.
- `delete` se ne piše. Kopiranje se ne prevodi, pa nema dva vlasnika.

---

<!-- [112] Zašto onda uopšte new i delete? -->
## Zašto onda uopšte `new` i `delete`?

- U ovom kursu **pravimo** strukture — moramo da vidimo šta je ispod.
- Veze među čvorovima menjamo običnom dodelom; `unique_ptr` traži premeštanje, koje ne radimo.

<div class="okvir">

U kodu koji strukture samo **koristi**: `std::vector`, `std::map`, `std::unique_ptr`. Bez ručnog `new`.

</div>

<p class="sitno">Zato u prva dva semestra niste napisali nijedan <code>delete</code>: <code>std::vector</code> radi po pravilu RAII.</p>

---

<!-- [113] Glava 2 — ukratko -->
## Glava 2 — ukratko

1. Pokazivač čuva adresu; `*p` je objekat, `p` je veza koja može da se promeni.
2. Referenca je drugo ime: spolja reference, iznutra pokazivači.
3. Niz je kontinualan, pa je `a[i]` u $O(1)$ — ali ne zna svoju dužinu i ne može da poraste.
4. `new` i `delete`: objekat živi dok ga neko ne oslobodi — tačno jednom.
5. Curenje, viseći pokazivač, dvostruko oslobađanje; plitko kopiranje.
6. RAII: konstruktor zauzima, destruktor oslobađa.

<p class="sitno">U knjizi: glava 2 u celini.</p>

- kad ponestane mesta: novi blok, prenos, `delete[]` starog
