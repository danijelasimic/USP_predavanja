# Dinamički niz

### Uvod u strukture podataka · Glava 3

---

<!-- [2] Plan -->
## Plan

<ol class="mapa">
<li class="sad">1. Veličina, kapacitet i klasa</li>
<li>2. Rast niza i cena dodavanja</li>
<li>3. Umetanje, brisanje, kopiranje</li>
</ol>

---

<!-- [3] Pitanje -->
<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

```cpp
std::vector<int> v;
for (int i = 0; i < 1000000; ++i)
    v.push_back(i);
```

Koliko puta je `v` tražio novi blok memorije?

<ul class="opcije">
<li><b>A</b>1 000 000 puta</li>
<li><b>B</b>oko 10 000 puta</li>
<li><b>C</b>oko 20 puta</li>
<li><b>D</b>jednom</li>
</ul>

---

<!-- [4] Odgovor -->
<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">C</span> — sa g++ tačno **21** put: kapacitet ide 1, 2, 4, 8, …, 1 048 576.

Ali svaki put kada dobije novi blok, `vector` mora da prepiše sve što već ima.

<div class="okvir">Danas: kako je to napravljeno i zašto je ipak brzo.</div>

---

<!-- [5] Niz fiksne dužine -->
## Niz fiksne dužine

```cpp
int a[100];
int n = 17;   // koliko elemenata stvarno koristimo
```

- `n` nije deo niza — o njemu brine **tvoj kod**
- 100 je premalo? Program ne može dalje.
- 10 000 „za svaki slučaj"? Memorija uglavnom stoji prazna.

Svaka unapred izabrana granica je ili premala ili rasipna.

---

<!-- [6] Učitavamo sve do kraja ulaza -->
## Učitavamo sve do kraja ulaza

```cpp
int a[10000];
int n = 0;

int x;
while (std::cin >> x)
    a[n++] = x;
```

- Ulaz ima 10 001 broj? Upis van niza — nedefinisano ponašanje (glava 2).
- Ulaz ima 5 brojeva? Rezervisano je 10 000 mesta.
- Do sada: `std::vector<int> a;` i `a.push_back(x);` — bez granice.

---

<!-- [7] Šta želimo -->
## Šta želimo

Strukturu koja **sama** brine o prostoru.

- broj elemenata
- pristup po indeksu, `a[i]`, kao i do sada — $O(1)$
- dodavanje elementa
- uklanjanje elementa

To je **dinamički niz** (eng. *dynamic array*) — ono što već koristite kao `std::vector`.

---

<!-- [8] Zašto ne proširimo postojeći blok? -->
## Zašto ne proširimo postojeći blok?

<div class="niz">
<span class="ime">memorija</span>
<span class="c">10</span><span class="c">20</span><span class="c">30</span><span class="c">40</span><span class="c z">?</span><span class="c z">?</span>
</div>

- Elementi moraju biti **uzastopni** — inače nema `a[i]` u $O(1)$.
- Memorija iza bloka je verovatno već nečija.
- Jedini izlaz: **novi, veći blok** i prenos elemenata.

---

<!-- [9] Veličina i kapacitet -->
## Veličina i kapacitet

<div class="niz">
<span class="ime">elementi</span>
<span class="c" data-i="0">10</span><span class="c" data-i="1">20</span><span class="c" data-i="2">30</span><span class="c" data-i="3">40</span><span class="c" data-i="4">50</span><span class="c r" data-i="5"></span><span class="c r" data-i="6"></span><span class="c r" data-i="7"></span>
</div>

- **veličina** = 5 — koliko elemenata niz sadrži (`size()`)
- **kapacitet** = 8 — koliko ih staje bez nove alokacije (`capacity()`)

Korisnika zanima samo veličina. Kapacitet je unutrašnja stvar strukture.

---

<!-- [10] Tri podatka u objektu -->
## Tri podatka u objektu

<svg viewBox="0 0 900 255" class="kop" role="img" aria-label="Objekat sa pokazivačem, veličinom i kapacitetom i blok od osam polja"><rect x="20" y="10" width="300" height="220" rx="8" class="obj"/><text x="36" y="38" class="naslov">a</text><text x="36" y="88" class="ime">elementi</text><rect x="190" y="55" width="110" height="46" class="cel"/><text x="36" y="143" class="ime">velicina_</text><rect x="190" y="110" width="110" height="46" class="cel"/><text x="245" y="141" class="sr">5</text><text x="36" y="198" class="ime">kapacitet_</text><rect x="190" y="165" width="110" height="46" class="cel"/><text x="245" y="196" class="sr">8</text><circle cx="245" cy="78" r="6" class="glava"/><rect x="400" y="55" width="62" height="46" class="cel"/><text x="431" y="86" class="sr">10</text><text x="431" y="122" class="sr adr">[0]</text><rect x="462" y="55" width="62" height="46" class="cel"/><text x="493" y="86" class="sr">20</text><text x="493" y="122" class="sr adr">[1]</text><rect x="524" y="55" width="62" height="46" class="cel"/><text x="555" y="86" class="sr">30</text><text x="555" y="122" class="sr adr">[2]</text><rect x="586" y="55" width="62" height="46" class="cel"/><text x="617" y="86" class="sr">40</text><text x="617" y="122" class="sr adr">[3]</text><rect x="648" y="55" width="62" height="46" class="cel"/><text x="679" y="86" class="sr">50</text><text x="679" y="122" class="sr adr">[4]</text><rect x="710" y="55" width="62" height="46" class="celr"/><text x="741" y="122" class="sr adr">[5]</text><rect x="772" y="55" width="62" height="46" class="celr"/><text x="803" y="122" class="sr adr">[6]</text><rect x="834" y="55" width="62" height="46" class="celr"/><text x="865" y="122" class="sr adr">[7]</text><path d="M245,78 C321.45,78 307.55,78 384,78" class="lin"/><polygon points="398,78 384,72 384,84" class="glava"/><path d="M402,150 L402,160 L708,160 L708,150" class="okv" style="stroke-dasharray:none;stroke:#1d5fa8"/><text x="555" y="188" class="sr ime">velicina_ = 5</text><path d="M402,205 L402,215 L894,215 L894,205" class="okv" style="stroke-dasharray:none;stroke:#5b6470"/><text x="648" y="243" class="sr ime">kapacitet_ = 8</text></svg>

- `elementi` — pokazivač na početak bloka
- `velicina_` i `kapacitet_` — dva broja, uz sam objekat

Prvih `velicina_` polja bloka je sadržaj niza. Ostalih `kapacitet_ - velicina_` je rezerva.

---

<!-- [11] Pitanje -->
<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Niz opisujemo parom (veličina, kapacitet). Koja stanja **nikada** ne smeju da se pojave?

<ul class="opcije">
<li><b>A</b>(0, 4)</li>
<li><b>B</b>(5, 4)</li>
<li><b>C</b>(4, 4)</li>
<li><b>D</b>(3, 0)</li>
</ul>

---

<!-- [12] Odgovor -->
<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="netacno">B</span> i <span class="netacno">D</span>: veličina ne sme da bude veća od kapaciteta.

A (prazan niz) i C (pun niz) su sasvim ispravni.

<div class="okvir">

**Invarijanta** (eng. *invariant*) dinamičkog niza: uvek važi
$0 \le$ `velicina` $\le$ `kapacitet`, `elementi` pokazuje na blok za `kapacitet` elemenata,
a pozicije $0, \dots,$ `velicina` $-1$ sadrže elemente niza.

</div>

Svaka operacija mora da je očuva — to je naš kriterijum ispravnosti.

---

<!-- [13] Pitanje -->
<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Niz ima veličinu 5 i kapacitet 8. Koliko još elemenata može da se doda **bez nove alokacije**?

<ul class="opcije">
<li><b>A</b>3</li>
<li><b>B</b>8</li>
<li><b>C</b>5</li>
<li><b>D</b>13</li>
</ul>

---

<!-- [14] Odgovor -->
<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">A</span> — `kapacitet - velicina` $= 8 - 5 = 3$.

Tek deveti element traži novi blok.

<p class="sitno">B je kapacitet, C je veličina, D je njihov zbir — nijedan od ta tri broja ne odgovara na pitanje „koliko još stane".</p>

---

<!-- [15] Isti kod, drugi tip -->
## Isti kod, drugi tip

Niz celih brojeva i niz realnih brojeva — razlikuju se u jednoj reči:

<div class="dve">
<div>

```cpp
class NizInt {
    int* elementi;
    std::size_t velicina_;
    std::size_t kapacitet_;
    // ...
};
```

</div>
<div>

```cpp
class NizDouble {
    double* elementi;
    std::size_t velicina_;
    std::size_t kapacitet_;
    // ...
};
```

</div>
</div>

I tako za `std::string`, `char`, `Tacka`... — a svaka ispravka se ponavlja u svakoj kopiji.

<p class="sitno">Zato <code>std::vector</code> nije skup ručno napisanih klasa, po jedne za svaki tip.</p>

---

<!-- [16] Šablon: tip kao parametar -->
## Šablon: tip kao parametar


Parametar šablona je **tip**:

```cpp
template <typename T>                  // T se popunjava pri upotrebi
class DinamickiNiz { /* ... T* elementi; ... */ };
```

- jednom napišemo klasu, za `T` upišemo ime tipa kad nam zatreba
- to je isto što radimo kad napišemo `vector<int>` ili `vector<double>`: ime u uglastim zagradama je tip koji popunjava rupu

---

<!-- [17] Šablon funkcije -->
<!-- .slide: class="mali" -->
## Šablon funkcije

Šablon ne mora biti klasa — isto radi i za običnu funkciju:

```cpp
template <typename T>
T veci(T a, T b)
{
    return a > b ? a : b;
}
```

```cpp
veci(3, 7)                           // 7        T je int
veci(2.5, 1.5)                       // 2.5      T je double
veci(std::string("ana"), std::string("marko"))   // marko
veci<double>(3, 2.5)                 // 3        T zadajemo sami
```

- kod funkcije prevodilac sam zaključuje `T` iz argumenata; kod klase ga pišemo u `<>`
- `veci(3, 2.5)` se ne prevodi: `T` ne može istovremeno da bude `int` i `double`

---

<!-- [18] Klasa: tri podatka -->
<!-- .slide: class="mali" -->
## Klasa: tri podatka

```cpp
template <typename T>
class DinamickiNiz {
private:
    T* elementi;
    std::size_t velicina_;
    std::size_t kapacitet_;

public:
    DinamickiNiz(std::size_t pocetni_kapacitet = 4);
    ~DinamickiNiz();

    std::size_t velicina() const;
    std::size_t kapacitet() const;

    T& operator[](std::size_t indeks);
    const T& operator[](std::size_t indeks) const;
};
```

<p class="sitno">Podatak i funkcija ne mogu imati isto ime, pa podaci dobijaju donju crtu: <code>velicina_</code>, a funkcija ostaje <code>velicina()</code>. <code>std::size_t</code> je neoznačen ceo tip — kao i u standardnoj biblioteci, koristimo ga za brojeve elemenata i pozicije.</p>

---

<!-- [19] Šablon klase -->
## Šablon klase

`template <typename T>` — čitaj: „za svaki tip `T`".

```cpp
DinamickiNiz<int>    a(10);
DinamickiNiz<double> b(20);
```

- Prevodilac pravi **dve različite klase**, zamenjujući `T` sa `int`, odnosno `double` — instanciranje šablona (eng. *instantiation*).
- Sve se razrešava pri prevođenju: nije sporije od ručno napisanog koda.
- Isto je `std::vector<int>` naspram `std::vector<double>`.

---

<!-- [20] Šta prevodilac radi sa šablonom -->
## Šta prevodilac radi sa šablonom

<div class="dve">
<div>

```cpp
// šablon (jednom napisan)
template <typename T>
class DinamickiNiz {
    T* elementi;
    // ...
};
```

</div>
<div>

```cpp
// DinamickiNiz<int> a(10);
class DinamickiNiz<int> {
    int* elementi;
    // ...
};
```

</div>
</div>

Pri svakoj upotrebi `DinamickiNiz<neki_tip>` prevodilac u šablonu zameni `T` tim tipom i dobije običnu klasu. Šablon sam nije tip — tip je tek `DinamickiNiz<int>`.

---

<!-- [21] Šta tip T mora da ume -->
## Šta tip `T` mora da ume

- `new T[k]` pravi `k` objekata: `T` mora da ima konstruktor bez argumenata
- elementi se prepisuju dodelom: `T` mora da ima `=`
- `int`, `double`, `std::string` to umeju

Ako nešto nedostaje, greška se prijavljuje **pri prevođenju**, u trenutku instanciranja.

<p class="sitno">Rezervisani deo bloka zato nije „prazan": sadrži objekte podrazumevane vrednosti. <code>std::vector</code> to izbegava — van okvira kursa.</p>

---

<!-- [22] Pitanje -->
<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

```cpp
DinamickiNiz<int>    a(4);
DinamickiNiz<double> b(4);
b = a;
```

Šta se dešava?

<ul class="opcije">
<li><b>A</b><code>int</code> vrednosti se pretvore u <code>double</code></li>
<li><b>B</b>greška pri prevođenju</li>
<li><b>C</b>prevodi se, ali program pada</li>
<li><b>D</b><code>b</code> postaje niz <code>int</code>-ova</li>
</ul>

---

<!-- [23] Odgovor -->
<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">B</span> — `DinamickiNiz<int>` i `DinamickiNiz<double>` su **dva različita tipa**.

To što je `int` moguće dodeliti `double`-u ne znači da je jedan niz moguće dodeliti drugom.

Isto važi i za `std::vector<int>` i `std::vector<double>`.

## Blok 1 — ukratko

- Dinamički niz = pokazivač na blok + **veličina** + **kapacitet**
- Invarijanta: $0 \le$ veličina $\le$ kapacitet, blok dovoljan za kapacitet

- `operator[]` vraća `T&`, a pretpostavku proverava `assert`

<p class="sitno">U knjizi: odeljci „Kapacitet i veličina" i „Klasa dinamičkog niza".</p>

<!-- [47] povecaj_kapacitet -->

## `povecaj_kapacitet`

```cpp [4|6|8-9|11|13-14]
template <typename T>
void DinamickiNiz<T>::povecaj_kapacitet()
{
    std::size_t novi_kapacitet = 2 * kapacitet_;

    T* novi = new T[novi_kapacitet];

    for (std::size_t i = 0; i < velicina_; ++i)
        novi[i] = elementi[i];

    delete[] elementi;

    elementi = novi;
    kapacitet_ = novi_kapacitet;
}
```

<p class="sitno">Pomoćna funkcija — korisnik ne treba da je poziva, pa ide u <code>private</code>.</p>

    if (velicina_ == kapacitet_)
        povecaj_kapacitet();

<!-- [54] Koliko košta dodavanje? -->
## Koliko košta dodavanje?

- Ima mesta: $O(1)$
- Nema mesta: prenose se svi elementi — $O(n)$

Da li je dinamički niz time propao?

<p class="fragment">Ne gledamo najgoru <b>jednu</b> operaciju, već ukupnu cenu <b>niza</b> operacija.</p>

<div class="fragment okvir">

**Amortizovana analiza** (eng. *amortized analysis*): ako $n$ operacija ukupno košta $T(n)$, amortizovana cena jedne je $T(n)/n$.

Nije prosečan slučaj: nema slučajnosti, ograničavamo **najgori** niz operacija.

</div>

<!-- [58] Strategija 1: kapacitet raste za k -->
## Strategija 1: kapacitet raste za $k$

Kapaciteti: $k, 2k, 3k, \dots$ — pri $i$-toj realokaciji prenosi se $ik$ elemenata.

<div class="f">
$$T(n) = \underbrace{n}_{\text{upisi}} + \underbrace{k + 2k + \dots + (m-1)k}_{\text{prenosi},\; m = n/k}$$
</div>

<div class="f">
$$= \frac{n^2}{2k} + \frac{n}{2} = O(n^2)$$
</div>

Amortizovano: $O(n)$ po dodavanju.

<div class="fragment okvir">Veće <i>k</i> samo deli cenu konstantom. Red veličine ostaje isti — kao što veći statički niz samo odlaže problem.</div>

---

<!-- [59] Strategija 2: kapacitet raste q puta -->
## Strategija 2: kapacitet raste $q$ puta

Kapaciteti: $1, 2, 4, 8, \dots, n$ (za $q = 2$).

Svi prenosi zajedno: $1 + 2 + 4 + \dots + n/2 < n$

Plus $n$ upisa novih elemenata: $T(n) < 2n = O(n)$

<div class="okvir">

Amortizovana cena dodavanja: **$O(1)$**. Za opšte $q > 1$: $T(n) \approx \frac{q}{q-1} n$.

</div>

<p class="sitno">Izvod sa geometrijskom sumom: knjiga, odeljak „Rast za konstantan činilac".</p>

<!-- [64] Koliki činilac q -->
## Koliki činilac $q$?

- Veće $q$: ređe realokacije, ali više prazne memorije (pri $q=2$, posle rasta je blok tek napola pun)
- Manje $q$: štedi memoriju, češće prenosi

Svako $q > 1$ daje amortizovano $O(1)$. Izbor je kompromis vreme–memorija.

Standard propisuje samo amortizovano $O(1)$ za `push_back`. Činilac bira implementacija.

## `umetni`

```cpp [4|6-7|9-10|12-13]
template <typename T>
void DinamickiNiz<T>::umetni(std::size_t indeks, const T& vrednost)
{
    assert(indeks <= velicina_);

    if (velicina_ == kapacitet_)
        povecaj_kapacitet();

    for (std::size_t i = velicina_; i > indeks; --i)
        elementi[i] = elementi[i - 1];

    elementi[indeks] = vrednost;
    ++velicina_;
}
```

<p class="sitno"><code>&lt;=</code>, a ne <code>&lt;</code>: umetanje na poziciju <code>velicina_</code> je dodavanje na kraj.</p>

---

<!-- [77] obrisi -->
## `obrisi`

```cpp
template <typename T>
void DinamickiNiz<T>::obrisi(std::size_t indeks)
{
    assert(indeks < velicina_);

    for (std::size_t i = indeks; i + 1 < velicina_; ++i)
        elementi[i] = elementi[i + 1];

    --velicina_;
}
```

Pomeranje ulevo, ovoga puta od mesta brisanja ka kraju.

Zašto `i + 1 < velicina_`, a ne `i < velicina_ - 1`?

## Kapacitet se ne smanjuje

Posle `obrisi` veličina je manja, a blok i kapacitet ostaju isti.

<p class="fragment">Zašto ne bismo smanjili blok čim je napola prazan?</p>

<p class="fragment">Niz oko granice: <code>dodaj</code>, <code>obrisi</code>, <code>dodaj</code>, <code>obrisi</code>… — realokacija pri <b>svakoj</b> operaciji, $O(n)$ svaki put.</p>

## Duboko kopiranje: konstruktor kopije

```cpp [2|3-5|7-8]
template <typename T>
DinamickiNiz<T>::DinamickiNiz(const DinamickiNiz<T>& drugi)
    : elementi(new T[drugi.kapacitet_]),
      velicina_(drugi.velicina_),
      kapacitet_(drugi.kapacitet_)
{
    for (std::size_t i = 0; i < velicina_; ++i)
        elementi[i] = drugi.elementi[i];
}
```

Svaki objekat dobija **svoj** blok — duboko kopiranje (eng. *deep copy*).

<p class="sitno">Parametar je <code>const&amp;</code>: prenos po vrednosti bi zahtevao kopiju — upravo ono što tek definišemo.</p>

<!-- [93] Operator dodele -->
<!-- .slide: class="mali" -->
## Operator dodele

```cpp [4-5|7-10|12|14-16|18]
template <typename T>
DinamickiNiz<T>& DinamickiNiz<T>::operator=(const DinamickiNiz<T>& drugi)
{
    if (this == &drugi)
        return *this;

    T* novi = new T[drugi.kapacitet_];

    for (std::size_t i = 0; i < drugi.velicina_; ++i)
        novi[i] = drugi.elementi[i];

    delete[] elementi;

    elementi = novi;
    velicina_ = drugi.velicina_;
    kapacitet_ = drugi.kapacitet_;

    return *this;
}
```

<p class="sitno">Isti redosled kao kod realokacije: novi blok, prenos, pa tek onda <code>delete[]</code>. Vraća se <code>*this</code> da bi radilo <code>a = b = c</code>.</p>

---

<!-- [94] Pitanje -->
<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Pitanje</span>

Obrišemo prve dve linije tela (proveru `this == &drugi`) i izvršimo `a = a;`. Šta se dešava **u ovoj verziji** operatora?

<ul class="opcije">
<li><b>A</b>čita se oslobođena memorija</li>
<li><b>B</b>dupli <code>delete</code></li>
<li><b>C</b>radi ispravno, samo nepotrebno kopira</li>
<li><b>D</b>greška pri prevođenju</li>
</ul>

---

<!-- [95] Odgovor -->
<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

<span class="tacno">C</span> — kopira se iz `elementi` u `novi` **pre** nego što se `elementi` oslobodi.

Da je `delete[]` na početku funkcije, odgovor bi bio A (`heap-use-after-free`).

<div class="okvir">Dobar redosled štiti i od samododele. Provera <code>this == &amp;drugi</code> ovde samo štedi posao.</div>

---

<!-- [96] Pravilo trojke -->
## Pravilo trojke

Kada klasa sama upravlja memorijom, potrebne su joj **sve tri**:

| funkcija | odgovara na pitanje |
| --- | --- |
| destruktor | kada se blok oslobađa? |
| konstruktor kopije | kako nastaje nezavisna kopija? |
| operator dodele | kako se zamenjuje postojeći blok? |

Ako kopiranje nema smisla — zabrani ga:

```cpp
Klasa(const Klasa&) = delete;
Klasa& operator=(const Klasa&) = delete;
```

<p class="sitno">Savremeni C++ dodaje još dve funkcije za premeštanje — „pravilo petorke". Van okvira kursa.</p>

---

<!-- [97] Za razmišljanje -->
<!-- .slide: data-background-color="#fdf3dc" -->
<span class="oznaka p">Za razmišljanje</span>

Niz ima veličinu 2 i kapacitet 2. Da li je ovo bezbedno?

```cpp
a.dodaj(a[0]);
```

Prati šta se dešava sa referencom `vrednost` unutar `dodaj`.

---

<!-- [98] Odgovor -->
<!-- .slide: data-background-color="#e6f3ea" -->
<span class="oznaka o">Odgovor</span>

**Nije.** `vrednost` je referenca na element **starog** bloka.

1. `povecaj_kapacitet` prenese elemente i oslobodi stari blok
2. `elementi[velicina_] = vrednost;` čita iz oslobođene memorije

Sanitajzer: `heap-use-after-free`.

`std::vector::push_back` ovaj slučaj ispravno rešava — jedna od stvari koje standardna biblioteka radi umesto nas.

---

<!-- [99] DinamickiNiz i std::vector -->
## `DinamickiNiz` i `std::vector`

| `DinamickiNiz<T>` | `std::vector<T>` |
| --- | --- |
| `velicina()` | `size()` |
| `kapacitet()` | `capacity()` |
| `dodaj(x)` | `push_back(x)` |
| `umetni(i, x)` | `insert(...)` |
| `obrisi(i)` | `erase(...)` |
| `operator[]` uz `assert` | `operator[]`, `at(i)` |

<p class="sitno"><code>insert</code> i <code>erase</code> ne primaju indeks, već iterator — o tome u glavi o povezanim listama.</p>

---

<!-- [100] Kada je vector pravi izbor -->
## Kada je `vector` pravi izbor?

- pristup po indeksu, obilazak redom
- kolekcija raste na kraju, veličina nije unapred poznata

Kada nije:

- često umetanje ili brisanje **na početku ili u sredini** velike kolekcije

<div class="okvir">Ne pitaj šta struktura <em>podržava</em> — <code>vector</code> podržava i umetanje na početak. Pitaj koliko koštaju operacije koje radiš <b>često</b>.</div>

---

<!-- [101] Glava 3 — ukratko -->
## Glava 3 — ukratko

1. Veličina ≠ kapacitet; invarijanta vezuje pokazivač, veličinu i kapacitet
2. Pun blok → realokacija; staro se oslobađa poslednje
3. Rast za činilac → dodavanje na kraj **amortizovano $O(1)$**
4. Umetanje i brisanje u sredini: $O(n)$, zbog uzastopnosti
5. Klasa koja poseduje memoriju: destruktor, konstruktor kopije, operator dodele

<p class="sitno">Sledeće: povezane liste — umetanje jeftino, pristup po indeksu skup.</p>
